# Render Blueprint — https://render.com/docs/blueprint-spec
#
# This file lives at backend/render.yaml, not the repo root, so when creating
# the Blueprint on Render ("New" → "Blueprint" → select this repo), set the
# "Blueprint Path" field to `backend/render.yaml` — Render only looks at the
# repo root by default. rootDir below then points the build/start commands
# at this same backend/ folder (the frontend is static and deploys to GitHub
# Pages separately — see the repo's CLAUDE.md).
#
# After the Blueprint creates the service, Render will prompt for the six
# `sync: false` values below (Supabase keys, Gemini key, Groq key, allowed
# origins) — nothing else needs to be touched to get a working deploy.
# Everything else here already has a working default; only change it if you
# want to.
services:
  - type: web
    name: calorie-tracker-api
    env: python
    region: frankfurt
    plan: free
    rootDir: backend
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    # The fast, dependency-free liveness ping (see main.py) — never calls
    # Supabase or Gemini, so a transient DB hiccup never fails Render's own
    # health check and takes the instance down. GET /health is the deeper
    # check meant for external uptime monitoring instead.
    healthCheckPath: /
    envVars:
      # --- Required — Render will prompt for these when the Blueprint is
      # first created; the app won't start without them. ---------------------
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Task B/C (text/JSON + conversational AI) primary — without this, all
      # of macro re-estimation, meal suggestions, and coach chat/recap/
      # damage-control fall straight to the native-Gemini last resort
      # (GEMINI_TEXT_MODELS below) on every single call instead of only
      # when genuinely needed. See CLAUDE.md's "Task-based AI routing"
      # section.
      - key: GROQ_API_KEY
        sync: false
      # Your GitHub Pages origin, e.g. https://your-username.github.io — CORS
      # rejects every request from any other origin.
      - key: ALLOWED_ORIGINS
        sync: false

      # --- Pinned so a Render build can't silently drift from local dev. ----
      - key: PYTHON_VERSION
        value: 3.14.3

      # --- Optional AI provider fallback — leave blank to keep it out of
      # Task A's vision chain (see backend/.env.example). ---------------------
      - key: NVIDIA_API_KEY
        value: ""

      # --- Everything below already has a working default in config.py —
      # listed here so it's visible and editable from the Render dashboard
      # without having to open the code. See backend/.env.example for the
      # full explanation of each one. ----------------------------------------
      - key: GEMINI_MODELS
        value: "gemini-flash-lite-latest:12:480,gemini-3.1-flash-lite:12:480,gemini-3.6-flash:4:18,gemini-3.5-flash:4:18"
      - key: GEMINI_MODEL_RPM
        value: 12
      - key: GEMINI_MODEL_RPD
        value: 480
      - key: GEMINI_VISION_THINKING_BUDGET
        value: 1024
      - key: GEMINI_DESCRIPTION_THINKING_BUDGET
        value: 512
      # Task B/C's true last-resort fallback, only reached once Groq's
      # entire model chain has failed — a deliberately different model than
      # GEMINI_MODELS above, so it's a separate quota pool from Task A's
      # vision traffic. See CLAUDE.md's "Task-based AI routing" section for
      # why this uses Gemini's native SDK, not the OpenAI-compat shim.
      - key: GEMINI_TEXT_MODELS
        value: "gemini-3-flash-preview:5:100"
      - key: GEMINI_TEXT_MODEL_RPM
        value: 5
      - key: GEMINI_TEXT_MODEL_RPD
        value: 100
      - key: NVIDIA_VISION_MODELS
        value: "z-ai/glm-5.2"
      - key: GROQ_MODELS
        value: "llama-3.3-70b-versatile:30:1000,openai/gpt-oss-120b:30:1000,qwen/qwen3.6-27b:30:1000,openai/gpt-oss-20b:30:1000,llama-3.1-8b-instant:30:14400"
      - key: GROQ_MODEL_RPM
        value: 30
      - key: GROQ_MODEL_RPD
        value: 1000
      - key: RETENTION_DAYS
        value: 7
      # Optional Sentry error tracking — leave blank to keep it disabled.
      - key: SENTRY_DSN
        value: ""
