# Render Blueprint — https://render.com/docs/blueprint-spec
#
# This file lives at backend/render.yaml, not the repo root, so when creating
# the Blueprint on Render ("New" → "Blueprint" → select this repo), set the
# "Blueprint Path" field to `backend/render.yaml` — Render only looks at the
# repo root by default. rootDir below then points the build/start commands
# at this same backend/ folder (the frontend is static and deploys to GitHub
# Pages separately — see the repo's CLAUDE.md).
#
# After the Blueprint creates the service, Render will prompt for the
# `sync: false` values below: 7 genuinely required (Supabase keys, Gemini
# key, Mistral key — Task B/C's primary provider as of 2026-08, see
# CLAUDE.md — Groq key, allowed origins) plus 3 optional ones you can leave
# blank at the prompt (NVIDIA key, Sentry DSN, USDA key) — nothing else
# needs to be touched to get a working deploy.
#
# Deliberately NOT listed here: every other Settings field in config.py
# (GEMINI_MODELS, GEMINI_MODEL_RPM/RPD, GEMINI_TEXT_MODELS, GROQ_MODELS,
# thinking budgets, etc.) — those already have a working default in
# config.py, and restating them here as plain `value:` entries would create
# a SECOND place those numbers live. Plain `value:` entries (unlike
# `sync: false`) are Blueprint-managed: Render enforces them on every sync,
# silently overwriting anything you change in the dashboard. That's exactly
# what happened once already — GEMINI_TEXT_MODELS sat here at a stale
# `:5:100` (5x the real Google-confirmed 20 RPD cap) after config.py had
# already been corrected to `:5:20`, and a Blueprint sync would have pushed
# the stale number right back. If you genuinely need to override one of
# these per-environment, prefer editing config.py's default directly (one
# source of truth, versioned) over adding it back here.
services:
  - type: web
    name: calorie-tracker-api
    env: python
    region: frankfurt
    plan: free
    rootDir: backend
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    # The fast, dependency-free liveness ping (see main.py) — never calls
    # Supabase or Gemini, so a transient DB hiccup never fails Render's own
    # health check and takes the instance down. GET /health is the deeper
    # check meant for external uptime monitoring instead.
    healthCheckPath: /
    envVars:
      # --- Required — Render will prompt for these when the Blueprint is
      # first created; the app won't start without them. ---------------------
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Task B/C (text/JSON + conversational AI) primary, as of 2026-08 —
      # without this AND GROQ_API_KEY below, all of macro re-estimation,
      # meal suggestions, and coach chat/recap/damage-control fall straight
      # to the native-Gemini last resort (GEMINI_TEXT_MODELS in config.py)
      # on every single call instead of only when genuinely needed. See
      # CLAUDE.md's "Task-based AI routing" section.
      - key: MISTRAL_API_KEY
        sync: false
      # Task B/C first fallback (only reached once Mistral's whole model
      # chain fails/is exhausted) — still a real, independent quota pool
      # worth keeping configured, not a redundant leftover.
      - key: GROQ_API_KEY
        sync: false
      # Your GitHub Pages origin, e.g. https://your-username.github.io — CORS
      # rejects every request from any other origin.
      - key: ALLOWED_ORIGINS
        sync: false

      # --- Optional — Render still prompts for these (so they're easy to
      # fill in later without editing YAML), but `sync: false` means once
      # you set a real value in the dashboard, a future Blueprint sync can
      # never silently wipe it back to blank the way a plain `value: ""`
      # entry would. Leave blank at the prompt to keep the feature off. -----
      - key: NVIDIA_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Nutrition database grounding (services/nutrition_db_service.py) —
      # free at https://api.data.gov/signup, no approval wait. Blank means
      # Open Food Facts (no key needed) is still used on its own; a real
      # key adds USDA FoodData Central for generic/raw ingredients too.
      - key: USDA_API_KEY
        sync: false

      # --- Pinned so a Render build can't silently drift from local dev. ----
      - key: PYTHON_VERSION
        value: 3.14.3

      # --- The one plain-value setting left: a genuine, low-risk per-deploy
      # tunable (not a secret, not something actively being retuned against
      # external provider numbers the way the Gemini/Groq settings above
      # are) — safe to keep versioned here. Change it here (not the
      # dashboard) if you ever want a different retention window; keep
      # sql/schema.sql's cleanup_old_logs() interval in sync manually if you
      # do (see that function's own comment). -------------------------------
      - key: RETENTION_DAYS
        value: 7
